# Internal-only PaddleOCR reverse proxy. This listener is not reachable from the
# public network; Laravel calls http://127.0.0.1:8081.
server {
    listen 127.0.0.1:8081;
    server_name localhost;

    access_log /var/log/nginx/ocr_internal_access.log;
    error_log /var/log/nginx/ocr_internal_error.log warn;
    client_max_body_size 16m;

    location = /health {
        proxy_pass http://127.0.0.1:8001/health;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /v1/ocr/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 110s;
        proxy_read_timeout 110s;
        proxy_request_buffering on;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        return 404;
    }
}
