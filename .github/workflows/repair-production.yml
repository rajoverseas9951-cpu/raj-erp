name: Repair Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimawallah-production
  cancel-in-progress: false

jobs:
  repair:
    name: Repair production and diagnose RTO
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repair and diagnose over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          command_timeout: 12m
          script: |
            set -Eeuo pipefail

            APP_DIR=/var/www/raj-erp
            BACKEND_PM2=raj-erp-backend
            EXPECTED_COMMIT='${{ github.sha }}'
            BACKEND_ENV_BACKUP=/tmp/raj-erp-backend.env.repair
            FRONTEND_ENV_BACKUP=/tmp/raj-erp-frontend.env.local.repair

            echo "=== Production repair ==="
            echo "Target commit: $EXPECTED_COMMIT"
            cd "$APP_DIR"

            if [ -f backend/.env ]; then cp -p backend/.env "$BACKEND_ENV_BACKUP"; fi
            if [ -f frontend/.env.local ]; then cp -p frontend/.env.local "$FRONTEND_ENV_BACKUP"; fi

            git fetch origin main
            git checkout main
            git reset --hard "$EXPECTED_COMMIT"

            if [ -f "$BACKEND_ENV_BACKUP" ]; then cp -p "$BACKEND_ENV_BACKUP" backend/.env; rm -f "$BACKEND_ENV_BACKUP"; fi
            if [ -f "$FRONTEND_ENV_BACKUP" ]; then cp -p "$FRONTEND_ENV_BACKUP" frontend/.env.local; rm -f "$FRONTEND_ENV_BACKUP"; fi

            ACTUAL_COMMIT="$(git rev-parse HEAD)"
            test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
            echo "Server commit: $ACTUAL_COMMIT"

            # A tracked controller must never remain locally modified after repair.
            if ! git diff --quiet -- backend/app/Features/Vehicles/Controllers/VehicleOperationsController.php; then
              echo "ERROR: VehicleOperationsController still differs from GitHub after hard reset."
              git diff -- backend/app/Features/Vehicles/Controllers/VehicleOperationsController.php || true
              exit 1
            fi
            echo "VehicleOperationsController matches GitHub."

            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== RTO database/schema diagnostic ==="
            php artisan tinker --execute="dump(\Illuminate\Support\Facades\Schema::hasTable('vehicle_rto_processes')); dump(\Illuminate\Support\Facades\Schema::getColumnListing('vehicle_rto_processes'));" || true

            echo "=== RTO routes diagnostic ==="
            php artisan route:list --path=vehicles | grep -Ei 'operations|rto' | tail -n 40 || true

            echo "=== Recent Laravel errors BEFORE reload ==="
            if [ -f storage/logs/laravel.log ]; then
              tail -n 250 storage/logs/laravel.log || true
            else
              echo "No laravel.log found."
            fi

            pm2 reload "$BACKEND_PM2" --update-env
            pm2 save
            sleep 3
            pm2 describe "$BACKEND_PM2" >/dev/null

            echo "=== Recent backend PM2 errors ==="
            pm2 logs "$BACKEND_PM2" --err --lines 120 --nostream || true

            echo "=== Repair complete ==="
            echo "Production backend repaired to: $ACTUAL_COMMIT"
