name: Repair Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimawallah-production
  cancel-in-progress: false

jobs:
  repair:
    name: Repair production backend and verify claims
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repair backend over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          command_timeout: 12m
          script: |
            set -Eeuo pipefail

            APP_DIR=/var/www/raj-erp
            BACKEND_PM2=raj-erp-backend
            EXPECTED_COMMIT='${{ github.sha }}'
            BACKEND_ENV_BACKUP=/tmp/raj-erp-backend.env.repair
            FRONTEND_ENV_BACKUP=/tmp/raj-erp-frontend.env.local.repair

            echo "=== Vimawallah production backend repair ==="
            echo "Target commit: $EXPECTED_COMMIT"
            cd "$APP_DIR"

            if [ -f backend/.env ]; then cp -p backend/.env "$BACKEND_ENV_BACKUP"; fi
            if [ -f frontend/.env.local ]; then cp -p frontend/.env.local "$FRONTEND_ENV_BACKUP"; fi

            git fetch origin main
            git checkout main
            git reset --hard "$EXPECTED_COMMIT"

            if [ -f "$BACKEND_ENV_BACKUP" ]; then cp -p "$BACKEND_ENV_BACKUP" backend/.env; rm -f "$BACKEND_ENV_BACKUP"; fi
            if [ -f "$FRONTEND_ENV_BACKUP" ]; then cp -p "$FRONTEND_ENV_BACKUP" frontend/.env.local; rm -f "$FRONTEND_ENV_BACKUP"; fi

            ACTUAL_COMMIT="$(git rev-parse HEAD)"
            test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
            echo "Server commit: $ACTUAL_COMMIT"

            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan db:seed --class='Database\\Seeders\\OperationalRolesSeeder' --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Verify operational roles ==="
            php artisan tinker --execute="$tenant=env('ADMIN_TENANT_ID','00000000-0000-4000-8000-000000000001'); $count=\\App\\Models\\Role::where('tenant_id',$tenant)->whereIn('slug',['administrator','branch-manager','insurance-executive','claims-executive','accounts-executive','rto-executive','read-only'])->count(); if ($count < 7) { throw new RuntimeException('Operational roles missing: '.$count.'/7'); } echo 'Operational roles OK: '.$count.PHP_EOL;"

            echo "=== Verify claims migration ==="
            php artisan tinker --execute="if (!\\Illuminate\\Support\\Facades\\Schema::hasTable('insurance_claims')) { throw new RuntimeException('insurance_claims table missing'); } echo 'insurance_claims table OK'.PHP_EOL;"

            echo "=== Verify Claims API routes ==="
            php artisan route:list --path=api/v1/claims | tee /tmp/vimawallah-claims-routes.txt
            grep -Fq 'api/v1/claims' /tmp/vimawallah-claims-routes.txt

            echo "=== Verify other insurance payment routes ==="
            php artisan route:list --path=api/v1/other-insurance-payments | tee /tmp/vimawallah-other-insurance-payment-routes.txt || true

            pm2 reload "$BACKEND_PM2" --update-env
            pm2 save
            sleep 3
            pm2 describe "$BACKEND_PM2" >/dev/null

            echo "=== Public Claims API probe ==="
            CLAIM_STATUS="$(curl --silent --show-error --output /tmp/vimawallah-claims-probe.txt --write-out '%{http_code}' \
              https://erp.vimawallah.com/api/v1/claims \
              --header 'Accept: application/json' || true)"
            echo "Claims API HTTP status: $CLAIM_STATUS"
            cat /tmp/vimawallah-claims-probe.txt || true
            case "$CLAIM_STATUS" in
              000|404|5??)
                echo "ERROR: Claims API is not healthy."
                exit 1
                ;;
            esac

            echo "=== Recent backend errors ==="
            pm2 logs "$BACKEND_PM2" --err --lines 80 --nostream || true

            echo "=== Repair complete ==="
            echo "Claims backend and operational roles are registered on production commit: $ACTUAL_COMMIT"
