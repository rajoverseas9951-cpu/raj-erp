name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimawallah-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vimawallah production
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          command_timeout: 55m
          script: |
            set -Eeuo pipefail

            APP_DIR=/var/www/raj-erp
            FRONTEND_PM2=raj-erp-frontend
            BACKEND_PM2=raj-erp-backend
            EXPECTED_COMMIT='${{ github.sha }}'

            echo "Deploying commit: $EXPECTED_COMMIT"
            cd "$APP_DIR"

            git fetch origin main
            git checkout main
            git pull --ff-only origin main

            ACTUAL_COMMIT="$(git rev-parse HEAD)"
            test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
            echo "Server checked out commit: $ACTUAL_COMMIT"

            cd "$APP_DIR/ocr-service"
            test -f .env || cp .env.example .env
            docker compose -f compose.production.yml config --quiet
            docker compose -f compose.production.yml build
            docker compose -f compose.production.yml up -d

            OCR_READY=0
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error http://127.0.0.1:8001/health >/dev/null; then
                OCR_READY=1
                break
              fi
              sleep 10
            done
            test "$OCR_READY" = "1"

            sudo -n install -m 0644 deploy/nginx-ocr-internal.conf /etc/nginx/conf.d/ocr-internal.conf
            sudo -n nginx -t
            sudo -n systemctl reload nginx
            curl --fail --silent --show-error http://127.0.0.1:8081/health

            cd "$APP_DIR/backend"
            if grep -q '^PADDLEOCR_URL=' .env; then
              sed -i 's#^PADDLEOCR_URL=.*#PADDLEOCR_URL=http://127.0.0.1:8081#' .env
            else
              printf '\nPADDLEOCR_URL=http://127.0.0.1:8081\n' >> .env
            fi
            if grep -q '^PADDLEOCR_TIMEOUT=' .env; then
              sed -i 's#^PADDLEOCR_TIMEOUT=.*#PADDLEOCR_TIMEOUT=100#' .env
            else
              printf 'PADDLEOCR_TIMEOUT=100\n' >> .env
            fi
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            cd "$APP_DIR/frontend"
            npm ci
            rm -rf .next
            NEXT_PUBLIC_API_URL=https://erp.vimawallah.com npm run build

            pm2 reload "$BACKEND_PM2" --update-env
            pm2 reload "$FRONTEND_PM2" --update-env
            pm2 save
            sleep 5

            pm2 describe "$BACKEND_PM2" >/dev/null
            pm2 describe "$FRONTEND_PM2" >/dev/null

            docker compose -f "$APP_DIR/ocr-service/compose.production.yml" ps
            curl --fail --silent --show-error http://127.0.0.1:8081/health
            curl --fail --silent --show-error https://erp.vimawallah.com/api/health
            LOGIN_HTML="$(curl --fail --silent --show-error https://erp.vimawallah.com/login)"

            ASSET_PATH="$(printf '%s' "$LOGIN_HTML" | grep -oE '/_next/static/[^\"[:space:]]+\.(css|js)' | head -n 1 || true)"
            test -n "$ASSET_PATH"
            curl --fail --silent --show-error "https://erp.vimawallah.com$ASSET_PATH" >/dev/null

            echo "Verified frontend asset: $ASSET_PATH"
            echo "Production deployment completed successfully."
