name: Diagnose OCR Routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-ocr-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Verify direct OCR API route
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verify production over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          command_timeout: 4m
          script: |
            set -Eeuo pipefail
            echo '=== INTERNAL OCR HEALTH ==='
            curl -sS --fail http://127.0.0.1:8001/health
            echo
            curl -sS --fail http://127.0.0.1:8081/health
            echo

            echo '=== DIRECT VPS API OCR PROBE ==='
            STATUS="$(curl -ksS --max-redirs 0 --output /tmp/api-ocr-body --dump-header /tmp/api-ocr-headers --write-out '%{http_code}' \
              -X POST https://api.vimawallah.com/api/v1/public-policy-ocr \
              -H 'Accept: application/json' \
              -H 'X-Vimawallah-Source: policy-analyzer' || true)"
            echo "HTTP=$STATUS"
            cat /tmp/api-ocr-headers || true
            cat /tmp/api-ocr-body || true
            echo
            case "$STATUS" in
              301|302|307|308|000|404|5??) echo 'Direct API route is unhealthy'; exit 1;;
            esac
            echo 'Direct API route is healthy and does not redirect.'
