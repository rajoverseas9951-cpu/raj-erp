name: Deploy App Safe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vimawallah-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Safe deploy backend and frontend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.PRODUCTION_SSH_HOST }}
          username: ${{ secrets.PRODUCTION_SSH_USER }}
          password: ${{ secrets.PRODUCTION_SSH_PASSWORD }}
          port: ${{ secrets.PRODUCTION_SSH_PORT || '22' }}
          command_timeout: 22m
          script: |
            set -Eeuo pipefail

            APP_DIR=/var/www/raj-erp
            FRONTEND_PM2=raj-erp-frontend
            BACKEND_PM2=raj-erp-backend
            SCHEDULER_PM2=raj-erp-scheduler
            EXPECTED_COMMIT='${{ github.sha }}'
            BACKEND_ENV_BACKUP=/tmp/raj-erp-backend.env.safe-deploy
            FRONTEND_ENV_BACKUP=/tmp/raj-erp-frontend.env.local.safe-deploy

            echo "=== Safe application deploy ==="
            echo "Target commit: $EXPECTED_COMMIT"
            cd "$APP_DIR"

            if [ -f backend/.env ]; then cp -p backend/.env "$BACKEND_ENV_BACKUP"; fi
            if [ -f frontend/.env.local ]; then cp -p frontend/.env.local "$FRONTEND_ENV_BACKUP"; fi

            git fetch origin main
            git checkout main
            git reset --hard "$EXPECTED_COMMIT"

            if [ -f "$BACKEND_ENV_BACKUP" ]; then cp -p "$BACKEND_ENV_BACKUP" backend/.env; rm -f "$BACKEND_ENV_BACKUP"; fi
            if [ -f "$FRONTEND_ENV_BACKUP" ]; then cp -p "$FRONTEND_ENV_BACKUP" frontend/.env.local; rm -f "$FRONTEND_ENV_BACKUP"; fi

            test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"

            cd "$APP_DIR/backend"
            composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "=== Verify claims routes ==="
            php artisan route:list --path=api/v1/claims | tee /tmp/vimawallah-claims-routes.txt
            grep -Fq 'api/v1/claims' /tmp/vimawallah-claims-routes.txt
            grep -Fq 'api/v1/claims/policies' /tmp/vimawallah-claims-routes.txt

            cd "$APP_DIR/frontend"
            npm ci
            rm -rf .next
            NEXT_PUBLIC_API_URL=https://erp.vimawallah.com npm run build

            pm2 reload "$BACKEND_PM2" --update-env
            pm2 reload "$FRONTEND_PM2" --update-env
            if pm2 describe "$SCHEDULER_PM2" >/dev/null 2>&1; then
              pm2 restart "$SCHEDULER_PM2" --update-env
            fi
            pm2 save
            sleep 4

            pm2 describe "$BACKEND_PM2" >/dev/null
            pm2 describe "$FRONTEND_PM2" >/dev/null

            CLAIM_STATUS="$(curl --silent --show-error --output /tmp/claims-check.txt --write-out '%{http_code}' https://erp.vimawallah.com/api/v1/claims --header 'Accept: application/json' || true)"
            echo "Claims endpoint HTTP: $CLAIM_STATUS"
            case "$CLAIM_STATUS" in
              000|404|5??) cat /tmp/claims-check.txt || true; exit 1;;
            esac

            POLICY_STATUS="$(curl --silent --show-error --output /tmp/claim-policies-check.txt --write-out '%{http_code}' https://erp.vimawallah.com/api/v1/claims/policies --header 'Accept: application/json' || true)"
            echo "Claim policy lookup HTTP: $POLICY_STATUS"
            case "$POLICY_STATUS" in
              000|404|5??) cat /tmp/claim-policies-check.txt || true; exit 1;;
            esac

            echo "Safe application deployment completed: $EXPECTED_COMMIT"
